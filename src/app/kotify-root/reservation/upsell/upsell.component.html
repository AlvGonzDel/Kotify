<ion-content [fullscreen]="true" class="upsell">
  <div class="flex items-center px-5 py-4">
    <app-back-button (back)="goBack()"></app-back-button>
    <h1
      class="flex-1 text-center text-xs font-semibold tracking-wider uppercase text-kotify-muted m-0"
    >
      Algo más
    </h1>
    <span class="w-10"></span>
  </div>

  <div class="px-5 pb-8">
    <h2 class="font-serif text-2xl text-kotify-ink font-medium mb-1">
      ¿Quieres añadir algo más?
    </h2>
    <p class="text-sm text-kotify-muted mb-6">
      Postres, bebidas y café. Si no quieres nada más, continúa.
    </p>

    <div class="grid grid-cols-2 gap-3">
      <div
        class="bg-white rounded-2xl overflow-hidden"
        *ngFor="let item of items"
      >
        <img
          class="w-full aspect-square object-cover"
          [src]="item.imageUrl"
          [alt]="item.name"
        />
        <div class="p-3 flex items-center justify-between gap-2">
          <div class="min-w-0">
            <p class="text-[13px] font-semibold text-kotify-ink truncate">
              {{ item.name }}
            </p>
            <p class="text-[13px] text-kotify-muted">
              {{ formatPrice(item.price) }} €
            </p>
          </div>

          <ng-container *ngIf="quantityOf(item) > 0; else addButton">
            <app-stepper
              size="sm"
              [value]="quantityOf(item)"
              [min]="0"
              (valueChange)="onQuantityChange(item, $event)"
            ></app-stepper>
          </ng-container>

          <ng-template #addButton>
            <button
              type="button"
              class="w-7 h-7 rounded-full bg-kotify-ink text-white flex items-center justify-center flex-shrink-0"
              [attr.aria-label]="'Añadir ' + item.name"
              (click)="addItem(item)"
            >
              <ion-icon name="add"></ion-icon>
            </button>
          </ng-template>
        </div>
      </div>
    </div>
  </div>

  <div class="px-5 pb-7 flex flex-col gap-3">
    <app-primary-button (pressed)="continue()">
      Ir al checkout
    </app-primary-button>
    <button
      type="button"
      class="text-sm text-kotify-muted/70 font-medium text-center"
      (click)="skip()"
    >
      No, gracias
    </button>
  </div>
</ion-content>
