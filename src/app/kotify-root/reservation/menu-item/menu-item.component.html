<ion-content [fullscreen]="true" class="menu-item" *ngIf="item() as item">
  <div
    class="relative h-56 bg-cover bg-center"
    [style.background-image]="'url(' + item.imageUrl + ')'"
  >
    <div class="absolute top-4 left-4 z-10">
      <app-back-button (back)="goBack()"></app-back-button>
    </div>
  </div>

  <div class="px-5 pt-6">
    <h1 class="font-serif text-2xl text-kotify-ink font-medium mb-2">
      {{ item.name }}
    </h1>
    <p class="text-kotify-muted text-[15px] leading-relaxed mb-4 max-w-[40ch]">
      {{ item.description }}
    </p>
    <p class="text-kotify-ink font-semibold text-lg mb-6">
      {{ formatPrice(item.price) }} €
    </p>

    <ng-container *ngIf="item.options?.length">
      <p class="text-xs tracking-wider uppercase text-kotify-muted mb-3">
        Aliño
      </p>
      <div class="flex flex-col gap-2.5 mb-6">
        <button
          type="button"
          *ngFor="let option of item.options"
          class="flex items-center gap-3 bg-white rounded-2xl px-4 py-3.5 border border-solid text-left"
          [ngClass]="
            option.id === selectedOptionId
              ? 'border-[#c1501f]'
              : 'border-transparent'
          "
          (click)="selectOption(option.id)"
        >
          <span
            class="w-5 h-5 rounded-full border border-solid flex items-center justify-center flex-shrink-0"
            [ngClass]="
              option.id === selectedOptionId
                ? 'border-[#c1501f]'
                : 'border-[#2b2420]/30'
            "
          >
            <span
              *ngIf="option.id === selectedOptionId"
              class="w-2.5 h-2.5 rounded-full bg-[#c1501f]"
            ></span>
          </span>
          <span class="text-[15px] text-kotify-ink">{{ option.label }}</span>
        </button>
      </div>
    </ng-container>

    <p class="text-xs tracking-wider uppercase text-kotify-muted mb-3">
      Notas (opcional)
    </p>
    <textarea
      class="w-full bg-white rounded-2xl px-4 py-3.5 text-[15px] text-[#2b2420] placeholder:text-[#8a6f5c] border border-solid border-transparent focus:border-[#c1501f] focus:outline-none mb-6 resize-none"
      rows="3"
      placeholder="Sin salsa, por favor. Un poco más de sal…"
      [(ngModel)]="notes"
    ></textarea>
  </div>

  <div class="px-5 pb-7">
    <app-primary-button (pressed)="addToOrder()">
      {{ isEditing ? "Actualizar pedido" : "Añadir al pedido" }} ·
      {{ formatPrice(item.price) }} €
    </app-primary-button>
  </div>
</ion-content>
