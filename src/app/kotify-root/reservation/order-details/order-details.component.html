<ion-content [fullscreen]="true" class="order-details">
  <div class="flex items-center px-5 py-4">
    <app-back-button (back)="goBack()"></app-back-button>
    <h1
      class="flex-1 text-center text-xs font-semibold tracking-wider uppercase text-kotify-muted m-0"
    >
      Tus datos
    </h1>
    <span class="w-10"></span>
  </div>

  <div class="px-5 pb-8">
    <p class="text-sm text-kotify-muted mb-6">
      Te enviamos la confirmación y el QR de reserva por email.
    </p>

    <p class="text-xs tracking-wider uppercase text-kotify-muted mb-2">
      Nombre
    </p>
    <input
      type="text"
      class="w-full bg-white rounded-2xl px-4 py-3.5 text-[15px] text-[#2b2420] placeholder:text-[#8a6f5c] border border-solid border-transparent focus:border-[#c1501f] focus:outline-none mb-5"
      placeholder="María García"
      [(ngModel)]="name"
      name="name"
    />

    <p class="text-xs tracking-wider uppercase text-kotify-muted mb-2">Email</p>
    <input
      type="email"
      class="w-full bg-white rounded-2xl px-4 py-3.5 text-[15px] text-[#2b2420] placeholder:text-[#8a6f5c] border border-solid border-transparent focus:border-[#c1501f] focus:outline-none mb-2"
      placeholder="maria@ejemplo.com"
      [(ngModel)]="email"
      name="email"
    />
    <p class="text-xs text-kotify-muted mb-6">
      Te enviamos la confirmación y el QR.
    </p>

    <button
      type="button"
      class="w-full flex items-start gap-3 bg-white rounded-2xl px-4 py-3.5 text-left"
      (click)="toggleSms()"
    >
      <span
        class="w-5 h-5 rounded-md border border-solid flex items-center justify-center flex-shrink-0 mt-0.5"
        [ngClass]="
          smsOptIn ? 'bg-[#c1501f] border-[#c1501f]' : 'border-kotify-ink/30'
        "
      >
        <ion-icon
          *ngIf="smsOptIn"
          name="checkmark"
          class="text-white text-xs"
        ></ion-icon>
      </span>
      <span>
        <span class="block text-[15px] font-semibold text-kotify-ink mb-0.5">
          Recibir confirmación por SMS
        </span>
        <span class="block text-[13px] text-kotify-muted">
          Te avisamos también cuando el restaurante empiece a preparar tu
          pedido.
        </span>
      </span>
    </button>
  </div>

  <div class="px-5 pb-7">
    <app-primary-button [disabled]="!isValid" (pressed)="continue()">
      Continuar
    </app-primary-button>
  </div>
</ion-content>
