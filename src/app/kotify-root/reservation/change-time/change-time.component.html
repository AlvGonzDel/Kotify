<ion-content [fullscreen]="true" class="change-time">
  <div class="flex items-center px-5 py-4">
    <app-back-button (back)="goBack()"></app-back-button>
    <h1
      class="flex-1 text-center text-xs font-semibold tracking-wider uppercase text-kotify-muted m-0"
    >
      Cambiar hora
    </h1>
    <span class="w-10"></span>
  </div>

  <!-- Paso 1: elegir intervalo -->
  <ng-container *ngIf="!selectedSlot(); else pickerStep">
    <div class="px-5 pb-8" *ngIf="reservation() as reservation">
      <div class="bg-[#fdf6e3] rounded-2xl px-4 py-3.5 mb-5">
        <p class="text-[14px] text-[#8a6f5c] leading-relaxed">
          <span class="font-semibold text-[#b5651d]">
            Reserva original: {{ reservation.arrivalTime }}.
          </span>
          Hemos desbloqueado el siguiente intervalo especialmente para ti.
        </p>
      </div>

      <div class="flex flex-col gap-2.5">
        <button
          type="button"
          *ngFor="let slot of slots"
          class="flex items-center justify-between bg-white rounded-2xl px-4 py-3.5 text-left disabled:opacity-40"
          [ngClass]="
            isUnlocked(slot) ? 'border-2 border-solid border-[#f4c95d]' : ''
          "
          [disabled]="!slot.available"
          (click)="selectSlot(slot)"
        >
          <span
            class="text-[15px] text-kotify-ink flex items-center gap-2 flex-wrap"
          >
            <span class="font-semibold">{{ slot.start }}</span>
            <span class="text-kotify-muted">— {{ slot.end }}</span>
            <span
              *ngIf="isUnlocked(slot)"
              class="text-xs font-semibold text-[#b5651d]"
            >
              Desbloqueado para ti
            </span>
          </span>
          <span
            class="text-xs font-semibold px-2.5 py-1 rounded-full flex-shrink-0"
            [ngClass]="
              slot.available
                ? 'bg-green-100 text-green-700'
                : 'bg-kotify-ink/5 text-kotify-muted'
            "
          >
            {{ slot.available ? "Disponible" : "Completo" }}
          </span>
        </button>
      </div>
    </div>
  </ng-container>

  <!-- Paso 2: afinar minutos, mismo componente que time-fine-tune -->
  <ng-template #pickerStep>
    <app-time-picker
      [slot]="selectedSlot()!"
      (confirmed)="onConfirmed($event)"
    ></app-time-picker>
  </ng-template>
</ion-content>
